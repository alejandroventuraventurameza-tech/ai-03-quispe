name: GPT-6 xhigh direct paper/Lean review (no Codex)

on:
  push:
    branches:
      - work/issue2-quality-closeout-20261123
    paths:
      - scripts/ci_gpt6_review.py
      - .github/workflows/gpt6-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-to-lean-model-audit:
    name: Direct GPT-6 API (requires secret)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Invoke GPT-6-family xhigh via Responses API (no Codex)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.2-astra
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/gpt6
          if [ -z "$OPENAI_API_KEY" ]; then
            python3 scripts/ci_gpt6_review.py
            exit 3
          fi
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          curl --fail --location --retry 3 --connect-timeout 30 \
            https://arxiv.org/pdf/2605.25438v2 -o ci-evidence/paper-v2.pdf
          pdftotext -layout ci-evidence/paper-v2.pdf ci-evidence/paper-v2.txt
          test -s ci-evidence/paper-v2.txt
          python3 scripts/ci_gpt6_review.py
          echo "Direct GPT-6-family Responses API run completed (xhigh)." >> "$GITHUB_STEP_SUMMARY"
          echo "Model review is NOT a Lean build or source-semantic formalization certificate." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload actual request metadata and response (or blocker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo3-gpt6-direct-api-audit
          path: ci-evidence/gpt6/
          if-no-files-found: warn
