name: Gaussian Bayes identity (numerical diagnostic)

on:
  push:
    branches:
      - work/issue2-quality-closeout-20261123
    paths:
      - scripts/check_gaussian_bayes_identity.py
      - .github/workflows/gaussian-bayes-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-factorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic 1003-case check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_gaussian_bayes_identity.py | tee gaussian-bayes-diagnostic.log
          {
            echo '### Gaussian Bayes identity — numerical diagnostic'
            echo 'This checks fixed-data log-density factorization, not a formal Lean proof.'
            cat gaussian-bayes-diagnostic.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-bayes-diagnostic
          path: gaussian-bayes-diagnostic.log
          if-no-files-found: warn
