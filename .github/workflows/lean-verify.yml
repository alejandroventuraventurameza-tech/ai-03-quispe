name: Reproduce Lean and EconCSLib (no Codex)

on:
  push:
    branches:
      - work/issue2-quality-closeout-20261123
    paths:
      - lean/**
      - extensions/**
      - .github/workflows/lean-verify.yml
  pull_request:
    branches:
      - main
    paths:
      - lean/**
      - extensions/**
      - .github/workflows/lean-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-3-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  econcslib-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPER: QX26AgenticDelegation
      UPSTREAM_COMMIT: 194edcc95df74806a39b961d10dedddc6e730cce
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out submitted weekly repository
        uses: actions/checkout@v4

      - name: Gaussian factorization numerical diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python3 scripts/check_gaussian_bayes_identity.py | tee ci-evidence/gaussian-bayes-logdensity.txt
          echo 'Gaussian identity: numerical only; no Lean posterior-equivalence claim.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download pinned EconCSLib successor
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --branch main https://github.com/nikhgarg/AppliedModelingLib.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          echo "upstream=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.30.0-rc2"

      - name: Reconstruct original paper folder without modifying repository files
        shell: bash
        run: |
          set -euo pipefail
          test -f lean/PaperInterface.lean
          test -f lean/ProofInterface.lean
          mkdir -p "upstream/papers/$PAPER" ci-evidence
          cp -a lean/. "upstream/papers/$PAPER/"
          cp extensions/*.lean "upstream/papers/$PAPER/"
          printf 'import QX26AgenticDelegation.ProofInterface\n' > "upstream/papers/$PAPER.lean"
          (cd upstream && python3 scripts/paper_target_registration.py register "$PAPER")
          printf 'weekly_sha=%s\nupstream_sha=%s\nlean_toolchain=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git -C upstream rev-parse HEAD)" \
            "$(cat upstream/lean-toolchain)" > ci-evidence/versions.txt
          find "upstream/papers/$PAPER" -maxdepth 3 -type f -print | LC_ALL=C sort > ci-evidence/paper-file-inventory.txt
          sha256sum lean/*.lean extensions/*.lean > ci-evidence/weekly-lean-sha256.txt
          echo "Prepared $PAPER under the pinned upstream checkout." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Lean and compile all proof endpoints
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: "false"
          build: "true"
          build-args: "QX26AgenticDelegation.AppendixA7ObservedJointBridge"
          test: "false"
          lint: "false"
          mk_all-check: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
          lake-package-directory: "upstream"

      - name: Record Lean version and inspect trusted axioms
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p ../ci-evidence
          lake env lean --version | tee ../ci-evidence/lean-version.txt
          cat > ../ci-evidence/axioms-check.lean <<'LEAN'
          import QX26AgenticDelegation.AppendixA7ObservedJointBridge
          #print axioms QX26AgenticDelegation.frontier_expansion
          #print axioms QX26AgenticDelegation.activation_band
          #print axioms QX26AgenticDelegation.cumulative_effect_nonneg
          #print axioms QX26AgenticDelegation.cumulative_gap_first_difference
          #print axioms QX26AgenticDelegation.cumulative_effect_strict_mono_closedFrontier
          #print axioms QX26AgenticDelegation.cumulative_effect_strict_concave_closedFrontier
          #print axioms QX26AgenticDelegation.cumulative_effect_endpoint_flat
          #print axioms QX26AgenticDelegation.specialist_heterogeneity
          #print axioms QX26AgenticDelegation.repository_expansion
          #print axioms QX26AgenticDelegation.auditedCumulativeGap_step
          #print axioms QX26AgenticDelegation.auditedCumulativeGap_nocatchup_iff
          #print axioms QX26AgenticDelegation.soloValue_eq_opportunity_sub_threshold
          #print axioms QX26AgenticDelegation.copilotValue_eq_opportunity_sub_threshold
          #print axioms QX26AgenticDelegation.delegationValue_eq_opportunity_sub_threshold
          #print axioms QX26AgenticDelegation.delegationAdvantage_eq_threshold_difference
          #print axioms QX26AgenticDelegation.preThreshold_eq_solo_of_foothold
          #print axioms QX26AgenticDelegation.postThreshold_eq_delegation_of_advantage
          #print axioms QX26AgenticDelegation.postThreshold_eq_pre_of_nonpositive_advantage
          #print axioms QX26AgenticDelegation.activation_band_from_economic_primitives
          #print axioms QX26AgenticDelegation.menu_surplus_weak_expansion
          #print axioms QX26AgenticDelegation.prop4_conditional_expected_expansion
          #print axioms QX26AgenticDelegation.prop4_more_candidates_weak
          #print axioms QX26AgenticDelegation.prop4_more_candidates_strict
          #print axioms QX26AgenticDelegation.prop4_more_ability_weak
          #print axioms QX26AgenticDelegation.prop5_count_gap_eq_band_sum
          #print axioms QX26AgenticDelegation.prop5_count_weak
          #print axioms QX26AgenticDelegation.prop5_expected_count_weak
          #print axioms QX26AgenticDelegation.prop5_expected_count_strict_of_positive_band_mass
          #print axioms QX26AgenticDelegation.prop1_menu_count_weak
          #print axioms QX26AgenticDelegation.prop1_count_gap_eq_sum
          #print axioms QX26AgenticDelegation.prop1_count_strict_of_new_mode_witness
          #print axioms QX26AgenticDelegation.prop1_band_implies_positive_delegation_advantage
          #print axioms QX26AgenticDelegation.prop1_count_strict_of_delegation_band
          #print axioms QX26AgenticDelegation.bayesA7_signal_precision_nonneg
          #print axioms QX26AgenticDelegation.bayesA7_signal_precision_pos_of_witness
          #print axioms QX26AgenticDelegation.bayesA7_posterior_precision_ge
          #print axioms QX26AgenticDelegation.bayesA7_posterior_precision_gt
          #print axioms QX26AgenticDelegation.bayesA7_posterior_mean_eq_source
          #print axioms QX26AgenticDelegation.bayesA7_normal_kernel_quadratic
          #print axioms QX26AgenticDelegation.bayesA7_weighted_mean_below_prior_of_signal_below
          #print axioms QX26AgenticDelegation.bayesA7_posterior_precision_pos
          #print axioms QX26AgenticDelegation.bayesA7_reciprocal_precision_pos
          #print axioms QX26AgenticDelegation.bayesA7_complete_square
          #print axioms QX26AgenticDelegation.bayesA7_exponential_kernel_factorization
          #print axioms QX26AgenticDelegation.bayesA7_gaussian_candidate_probability
          #print axioms QX26AgenticDelegation.bayesA7_gaussian_candidate_mean
          #print axioms QX26AgenticDelegation.bayesA7_evidence_kernel_factor_pos
          #print axioms QX26AgenticDelegation.bayesA7_normalized_kernel_eq_gaussian_shape
          #print axioms QX26AgenticDelegation.bayesA7_normalized_density_eq_gaussian_pdf
          #print axioms QX26AgenticDelegation.bayesA7_normalized_density_integral_one
          #print axioms QX26AgenticDelegation.bayesA7_normalized_density_measure_eq_gaussian_candidate
          #print axioms QX26AgenticDelegation.bayesA7_joint_draw_probability
          #print axioms QX26AgenticDelegation.bayesA7_joint_coordinates_independent
          #print axioms QX26AgenticDelegation.bayesA7_joint_prior_marginal
          #print axioms QX26AgenticDelegation.bayesA7_joint_noise_marginal
          #print axioms QX26AgenticDelegation.bayesA7_prior_independent_of_noise
          #print axioms QX26AgenticDelegation.bayesA7_observed_signal_marginal
          #print axioms QX26AgenticDelegation.bayesA7_noise_coordinates_independent
          #print axioms QX26AgenticDelegation.bayesA7_signal_shift_measurable
          #print axioms QX26AgenticDelegation.bayesA7_signal_map_measurable
          #print axioms QX26AgenticDelegation.bayesA7_signal_kernel_markov
          #print axioms QX26AgenticDelegation.bayesA7_signal_kernel_apply_eq_shifted_noise
          #print axioms QX26AgenticDelegation.bayesA7_shifted_noise_eq_gaussian_product
          #print axioms QX26AgenticDelegation.bayesA7_signal_kernel_eq_gaussian_product
          #print axioms QX26AgenticDelegation.bayesA7_signals_independent_given_theta
          #print axioms QX26AgenticDelegation.bayesA7_conditional_signal_marginal
          #print axioms QX26AgenticDelegation.bayesA7_posterior_is_markov
          #print axioms QX26AgenticDelegation.bayesA7_posterior_disintegration
          #print axioms QX26AgenticDelegation.bayesA7_posterior_recovers_prior
          #print axioms QX26AgenticDelegation.bayesA7_posterior_unique_ae
          #print axioms QX26AgenticDelegation.bayesA7_draw_law_split_noise_prior
          #print axioms QX26AgenticDelegation.bayesA7_draw_law_split_prior_noise
          #print axioms QX26AgenticDelegation.bayesA7_prior_noise_to_observed_pair_measurable
          #print axioms QX26AgenticDelegation.bayesA7_prior_noise_observed_eq_compProd
          #print axioms QX26AgenticDelegation.bayesA7_joint_draw_observed_eq_compProd
          #print axioms QX26AgenticDelegation.bayesA7_original_draw_posterior_disintegration
          LEAN
          lake env lean ../ci-evidence/axioms-check.lean 2>&1 | tee ../ci-evidence/axioms-output.txt
          if grep -E 'sorryAx|unsafeAx' ../ci-evidence/axioms-output.txt; then
            echo "::error::Unexpected sorryAx or unsafe axiom in reviewed endpoints"
            exit 1
          fi

      - name: Run the required EconCSLib paper-scoped fast check
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 scripts/paper_contribution.py check QX26AgenticDelegation --fast 2>&1 | tee ../ci-evidence/paper-fast-check.txt
          echo "Lean ProofInterface and paper_contribution check --fast both PASS." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs even if checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo3-lean-reproduction
          path: ci-evidence/
          if-no-files-found: warn
